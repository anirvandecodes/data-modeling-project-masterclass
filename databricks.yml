bundle:
  name: data-modeling-masterclass

variables:
  catalog:
    default: workspace
  volume_path:
    default: /Volumes/workspace/bronze/raw_data

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-aef35066-afa2.cloud.databricks.com
      profile: anirvandecodes

resources:
  jobs:
    data_modeling_pipeline:
      name: "Data Modeling Masterclass — Full Pipeline"
      tags:
        project: data-modeling-masterclass
        owner: anirvan

      tasks:

        - task_key: setup
          description: "Create schemas and volume"
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/00_setup
            source: WORKSPACE

        - task_key: bronze_ingest
          description: "Land raw CSVs into Bronze Delta tables"
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/01_bronze_ingest
            source: WORKSPACE

        - task_key: dim_date
          description: "Build dim_date — 2020 to 2025"
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/02_dim_date
            source: WORKSPACE

        - task_key: dim_product
          description: "Build dim_product with MD5 surrogate key"
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/03_dim_product
            source: WORKSPACE

        - task_key: dim_location
          description: "Build dim_location with MD5 surrogate key"
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/04_dim_location
            source: WORKSPACE

        - task_key: dim_customer_scd2
          description: "Build dim_customer with SCD Type 2 (full history)"
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/05b_dim_customer_scd2
            source: WORKSPACE

        - task_key: fact_orders
          description: "Build fact_orders — lookup join, role-playing, degenerate dim"
          depends_on:
            - task_key: dim_date
            - task_key: dim_product
            - task_key: dim_location
            - task_key: dim_customer_scd2
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/06_fact_orders
            source: WORKSPACE

        - task_key: fact_returns
          description: "Build fact_returns — conformed dimensions"
          depends_on:
            - task_key: dim_date
            - task_key: dim_product
            - task_key: dim_customer_scd2
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/07_fact_returns
            source: WORKSPACE

        - task_key: advanced_facts
          description: "Periodic snapshot, accumulating snapshot, factless facts"
          depends_on:
            - task_key: fact_orders
            - task_key: fact_returns
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/10_fact_table_types
            source: WORKSPACE

        - task_key: snowflake_schema
          description: "Build snowflake schema variant of dim_product"
          depends_on:
            - task_key: fact_orders
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/11_star_vs_snowflake
            source: WORKSPACE

        - task_key: analytics
          description: "Answer all 4 business questions + bonus metrics"
          depends_on:
            - task_key: fact_orders
            - task_key: fact_returns
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/08_analytics_queries
            source: WORKSPACE

        - task_key: metrics
          description: "Compute business metrics: DAU, MAU, AOV, cohort retention, return rate"
          depends_on:
            - task_key: analytics
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/12_metrics_and_product_sense
            source: WORKSPACE

      queue:
        enabled: true
