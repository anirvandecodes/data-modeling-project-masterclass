bundle:
  name: data-modeling-masterclass

variables:
  catalog:
    default: workspace
  volume_path:
    default: /Volumes/workspace/bronze/raw_data

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-aef35066-afa2.cloud.databricks.com
      profile: anirvandecodes

resources:
  jobs:
    data_modeling_pipeline:
      name: "Data Modeling Masterclass — Full Pipeline"
      tags:
        project: data-modeling-masterclass
        owner: anirvan

      tasks:

        - task_key: physical_setup
          description: "Create schemas and volume"
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/06_physical_setup
            source: WORKSPACE

        - task_key: bronze_ingest
          description: "Land raw CSVs into Bronze Delta tables"
          depends_on:
            - task_key: physical_setup
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/07_bronze_ingest
            source: WORKSPACE

        - task_key: dim_date
          description: "Build dim_date — calendar dimension 2020–2025"
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/08_dim_date
            source: WORKSPACE

        - task_key: dim_product
          description: "Build dim_product with MD5 surrogate key"
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/09_dim_product
            source: WORKSPACE

        - task_key: dim_location
          description: "Build dim_location with MD5 surrogate key"
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/10_dim_location
            source: WORKSPACE

        - task_key: dim_customer
          description: "Build dim_customer with SCD Type 2"
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/12_dim_customer_scd2
            source: WORKSPACE

        - task_key: fact_orders
          description: "Build fact_orders — lookup join, role-playing, degenerate dim"
          depends_on:
            - task_key: dim_date
            - task_key: dim_product
            - task_key: dim_location
            - task_key: dim_customer
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/14_fact_orders
            source: WORKSPACE

        - task_key: fact_returns
          description: "Build fact_returns — conformed dimensions"
          depends_on:
            - task_key: dim_date
            - task_key: dim_product
            - task_key: dim_customer
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/15_fact_returns
            source: WORKSPACE

        - task_key: fact_types
          description: "Periodic snapshot, accumulating snapshot, factless facts"
          depends_on:
            - task_key: fact_orders
            - task_key: fact_returns
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/13_fact_design_and_types
            source: WORKSPACE

        - task_key: star_vs_snowflake
          description: "Build snowflake schema variant and compare"
          depends_on:
            - task_key: fact_orders
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/05_star_schema_design
            source: WORKSPACE

        - task_key: analytics
          description: "Answer all 4 business questions + business metrics"
          depends_on:
            - task_key: fact_orders
            - task_key: fact_returns
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/16_analytics_and_metrics
            source: WORKSPACE

      queue:
        enabled: true
